name: Refresh weather feed and publish display
on:
  # Run after GitHub's branch-based Pages build so it cannot overwrite the backup feed.
  workflow_run:
    workflows: ['pages build and deployment']
    types: [completed]
    branches: [main]
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: weather-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Retrieve current Concord NWS alerts
        run: python3 scripts/refresh_alerts.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish radar and timestamped backup feed
        id: deployment
        uses: actions/deploy-pages@v4
