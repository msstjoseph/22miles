name: Refresh weather feed and publish display
on:
  push:
    branches: [main]
  schedule:
    - cron: '2-57/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: weather-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Wait for the normal branch Pages publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/wait_for_pages.py
      - name: Retrieve current Concord NWS alerts
        run: python3 scripts/refresh_alerts.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish radar and timestamped backup feed
        id: deployment
        uses: actions/deploy-pages@v4
