<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concord weather alerts</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
body { font-family: Arial, sans-serif; background: #18352d; color: #fff; }
body.warning { background: #aa1717; }
body.watch { background: #805400; }
body.advisory { background: #24415b; }
body.unavailable { background: #424242; }
#banner { display: flex; align-items: center; height: 100%; }
#label { flex: none; height: 100%; display: flex; align-items: center;
  padding: 0 .5em; background: rgba(0,0,0,.24); font-size: 42vh;
  font-weight: bold; letter-spacing: .04em; }
#window { flex: 1; min-width: 0; overflow: hidden; }
#track { display: flex; width: max-content; will-change: transform;
  animation: scroll var(--duration, 25s) linear infinite; }
.copy { display: block; flex: none; white-space: nowrap; padding-right: 5em;
  font-size: 70vh; font-weight: bold; line-height: 1.05; }
@keyframes scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
</style>
</head>
<body>
<div id="banner">
  <div id="label">CONCORD</div>
  <div id="window"><div id="track"><span class="copy">Checking weather alerts…</span><span class="copy" aria-hidden="true">Checking weather alerts…</span></div></div>
</div>
<script>
'use strict';
// NWS point lookup for central Concord, NC (28025), rather than an entire county.
const ALERT_URL = 'https://api.weather.gov/alerts/active?point=35.4088,-80.5795';
const REFRESH_MS = 60000;
const DIRECT_STALE_MS = 5 * 60000;
const BACKUP_STALE_MS = 15 * 60000;
const BACKUP_URL = 'https://msstjoseph.github.io/22miles/alerts-data.json';
let staleAfter = DIRECT_STALE_MS;
let usingBackup = false;
const track = document.getElementById('track');
const copies = Array.from(document.querySelectorAll('.copy'));
let lastSuccess = 0;
let latest = [];
let busy = false;
let currentMessage = '';

function sizeTicker() {
  copies.forEach(copy => copy.style.minWidth = document.getElementById('window').clientWidth + 'px');
  track.style.setProperty('--duration', Math.max(16, copies[0].getBoundingClientRect().width / 55) + 's');
}

function show(message, kind) {
  document.body.className = kind;
  if (message !== currentMessage) {
    currentMessage = message;
    copies.forEach(copy => copy.textContent = message);
    track.style.animation = 'none';
    sizeTicker();
    void track.offsetWidth;
    track.style.animation = '';
  }
}

function activeAlerts(features) {
  const now = Date.now();
  const seen = new Set();
  return features.map(feature => feature.properties).filter(p => {
    if (!p || !p.event || p.status !== 'Actual' || p.messageType === 'Cancel') return false;
    const end = Date.parse(p.ends || p.expires);
    if (!Number.isFinite(end) || end <= now) return false;
    const key = p.id || [p.event, p.headline, p.expires].join('|');
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  }).sort((a, b) => rank(b) - rank(a));
}

function rank(p) {
  const severity = { Extreme: 4, Severe: 3, Moderate: 2, Minor: 1 };
  return (severity[p.severity] || 0) * 10 + (/Warning/i.test(p.event) ? 3 : /Watch/i.test(p.event) ? 2 : 1);
}

function displayLatest() {
  if (!lastSuccess || Date.now() - lastSuccess > staleAfter) {
    show('Alerts unavailable — unable to confirm current conditions', 'unavailable');
    return;
  }
  const alerts = activeAlerts(latest);
  const checked = usingBackup ? ' • Checked ' + new Date(lastSuccess).toLocaleTimeString('en-US', { timeZone: 'America/New_York', hour: 'numeric', minute: '2-digit' }) : '';
  if (!alerts.length) {
    show('No active alerts • Concord, NC 28025 • National Weather Service' + checked, '');
    return;
  }
  const message = alerts.map(p => {
    const end = new Date(p.ends || p.expires).toLocaleString('en-US', {
      timeZone: 'America/New_York', weekday: 'short', hour: 'numeric', minute: '2-digit', timeZoneName: 'short'
    });
    return p.event + ' — ' + (p.headline || p.areaDesc || 'Concord, NC') + ' • Until ' + end;
  }).join('     •     ');
  const kind = alerts.some(p => /Warning/i.test(p.event) || p.severity === 'Extreme') ? 'warning'
    : alerts.some(p => /Watch/i.test(p.event)) ? 'watch' : 'advisory';
  show(message + checked, kind);
}

// XMLHttpRequest also works on signage players with limited fetch/AbortController support.
function requestJSON(url) {
  return new Promise(function (resolve, reject) {
    const xhr = new XMLHttpRequest();
    xhr.open('GET', url, true);
    xhr.timeout = 12000;
    xhr.onload = function () {
      try {
        if (xhr.status < 200 || xhr.status >= 300) throw new Error('HTTP ' + xhr.status);
        const data = JSON.parse(xhr.responseText);
        if (data.type !== 'FeatureCollection' || !Array.isArray(data.features)) throw new Error('Invalid alert feed');
        resolve(data);
      } catch (error) { reject(error); }
    };
    xhr.onerror = function () { reject(new Error('Network unavailable')); };
    xhr.ontimeout = function () { reject(new Error('Request timed out')); };
    xhr.send();
  });
}

async function updateAlerts() {
  if (busy) return;
  busy = true;
  try {
    let data;
    try {
      data = await requestJSON(ALERT_URL);
      lastSuccess = Date.now();
      staleAfter = DIRECT_STALE_MS;
      usingBackup = false;
    } catch (directError) {
      // This file is refreshed by GitHub, so the player need only reach the site it already displays.
      data = await requestJSON(BACKUP_URL + '?t=' + Date.now());
      const checkedAt = Date.parse(data.checkedAt);
      const age = Date.now() - checkedAt;
      if (!Number.isFinite(checkedAt) || age < -60000 || age > BACKUP_STALE_MS) {
        throw new Error('Backup alert feed is stale');
      }
      lastSuccess = checkedAt;
      staleAfter = BACKUP_STALE_MS;
      usingBackup = true;
    }
    latest = data.features;
    displayLatest();
  } catch (error) {
    show('Alerts unavailable — unable to confirm current conditions', 'unavailable');
  } finally {
    busy = false;
  }
}
window.addEventListener('resize', sizeTicker);
sizeTicker();
updateAlerts();
setInterval(updateAlerts, REFRESH_MS);
// Clear expired alerts and identify stale data between network checks.
setInterval(() => {
  if (document.body.className !== 'unavailable') displayLatest();
}, 10000);
</script>
</body>
</html>
